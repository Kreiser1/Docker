name: Student CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.13"
            - run: python --version
            - run: python -m unittest discover -s tests -p test_app.py -v
    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - run: docker compose --profile "*" config --quiet
            - run: docker build -f docker/bootstrap.Dockerfile -t devops-course:base lab
            - run: docker build -f docker/tools.Dockerfile -t devops-course-tools:base .
            - run: docker build -f docker/ansible.Dockerfile -t devops-course-ansible:base .
