services:
  api:
    image: devops-course:base
    pull_policy: never
    environment:
      ROLE: api
      DATA_DIR: /data
    volumes:
      - requests:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
  web:
    image: devops-course:base
    pull_policy: never
    environment:
      ROLE: web
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
  tools:
    image: devops-course-tools:base
    pull_policy: never
    profiles: [tools]
    pid: service:api
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
  registry:
    image: registry:3.0.0
    profiles: [registry]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry:/var/lib/registry
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning/datasources:ro
      - grafana:/var/lib/grafana
  ansible:
    image: devops-course-ansible:base
    pull_policy: never
    profiles: [tools]
    volumes:
      - ./ansible:/work:ro
      - requests:/data
volumes:
  requests:
  registry:
  prometheus:
  grafana:
